<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoBoard Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html">NeoBoard</a>
        <nav class="top-nav">
          <a href="index.html">Dashboard</a>
          <a href="progress.html">Progress</a>
          <a href="tasks.html">To-Do</a>
          <a href="docs.html">Docs AI</a>
          <a href="assistant.html">Assistant</a>
        </nav>
        <label class="search-wrap"><span>Search</span><input id="globalSearch" placeholder="Search docs and press Enter" /></label>
        <div class="account">Customer name</div>
      </header>

      <main id="tasksPage" class="content">
        <div id="globalError" class="muted"></div>

        <section class="card">
          <div class="card-header"><h2>Create Task</h2></div>
          <form id="taskForm" class="row">
            <input id="taskInput" placeholder="Task text" required />
            <select id="taskPriority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
            <button class="primary" type="submit">Add</button>
          </form>
        </section>

        <section class="card" style="margin-top:18px">
          <div class="card-header">
            <h2>Task List</h2>
            <input id="taskSearch" style="max-width:320px" placeholder="Filter tasks" />
          </div>
          <ul id="taskList" class="list"></ul>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
